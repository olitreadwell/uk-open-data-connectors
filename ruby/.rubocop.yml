AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  SuggestExtensions: false
  Exclude:
    - 'lib/ukdata/fixtures/**/*'
    - 'spec/**/*'
    - 'ukdata.gemspec'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 100

Metrics/ModuleLength:
  Max: 400

Metrics/MethodLength:
  Max: 40

Metrics/AbcSize:
  Max: 50

Metrics/ClassLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Style/Documentation:
  Enabled: false

Lint/StructNewOverride:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false
